<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PinPin 足跡</title>
    
    <!-- 核心樣式與套件 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 載入質感字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- 自定義 Tailwind Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        line: '#06C755',
                        'line-dark': '#05b34c',
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            /* 防止 iOS 橡皮筋效果與網頁滑動 */
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 地圖高質感化濾鏡 */
        .leaflet-tile {
            filter: grayscale(15%) contrast(98%) brightness(98%);
        }
        
        /* 隱藏地圖預設標籤歸屬權樣式 */
        .leaflet-control-attribution {
            font-size: 8px !important;
            opacity: 0.5;
        }

        /* 隱藏滾動條但保留功能 */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Apple 風格模糊彈出視窗微調 */
        .swal2-popup.custom-swal {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif !important;
            border-radius: 1.5rem !important;
            padding: 1.5rem !important;
            border: 1px solid rgba(241, 245, 249, 0.8) !important;
        }
        .swal2-title {
            font-size: 1.25rem !important;
            font-weight: 700 !important;
            color: #1e293b !important;
        }
        .swal2-confirm {
            border-radius: 0.75rem !important;
            font-weight: 600 !important;
            padding: 0.625rem 2rem !important;
        }
        .swal2-cancel {
            border-radius: 0.75rem !important;
            font-weight: 600 !important;
            padding: 0.625rem 1.5rem !important;
        }
        .swal2-input {
            border-radius: 0.75rem !important;
            border: 1px solid #e2e8f0 !important;
            box-shadow: none !important;
            transition: all 0.2s !important;
        }
        .swal2-input:focus {
            border-color: #06C755 !important;
            box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.15) !important;
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col font-sans selection:bg-line/10">

    <!-- 非 LINE 環境的頂部提示 (設計感 Fallback Banner) -->
    <div id="line-fallback-banner" class="hidden bg-white/80 backdrop-blur-md px-4 py-3.5 shadow-[0_1px_3px_rgba(0,0,0,0.02)] z-50 sticky top-0 border-b border-slate-100 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 text-slate-600 font-medium text-xs">
            <div class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></div>
            <span>建議在 LINE 中開啟以獲得最佳定位體驗</span>
        </div>
        <button id="open-line-btn" class="bg-line hover:bg-line-dark text-white font-semibold text-xs px-3.5 py-2 rounded-lg active:scale-[0.97] transition-all flex items-center gap-1.5 shadow-sm">
            <i class="fa-brands fa-line text-sm"></i>
            在 LINE 中開啟
        </button>
    </div>

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md py-3.5 px-4 z-40 flex justify-between items-center sticky top-0 border-b border-slate-100" id="app-header">
        <h1 class="text-base font-bold flex items-center gap-2 text-slate-900 tracking-tight">
            <span class="w-8 h-8 rounded-lg bg-emerald-50 flex items-center justify-center text-line">
                <i class="fa-solid fa-map-pin text-sm rotate-12"></i>
            </span>
            <span>PinPin 足跡</span>
        </h1>
        <div id="status-indicator" class="text-[10px] px-2.5 py-1 rounded-full font-semibold transition-all duration-200">
            Wait For Init
        </div>
    </header>

    <!-- Map Area (Rounded Panel Widget Style) -->
    <div class="relative px-4 pt-3 pb-1 w-full max-w-md mx-auto z-10">
        <div class="relative overflow-hidden rounded-2xl border border-slate-100 shadow-[0_4px_20px_rgba(0,0,0,0.03)] bg-white">
            <div id="map" class="!h-[32vh]"></div>
            
            <!-- 重新定位按鈕 (Floating) -->
            <button id="recenter-btn" class="absolute bottom-4 right-4 bg-white hover:bg-slate-50 p-2.5 rounded-xl shadow-md border border-slate-100 text-slate-700 active:scale-95 transition-all z-[400]" title="回到目前位置">
                <i class="fa-solid fa-crosshairs text-base"></i>
            </button>
        </div>
    </div>

    <!-- Actions Area -->
    <main class="flex-1 max-w-md mx-auto w-full px-4 pb-8 flex flex-col gap-6">
        
        <!-- 主要操作卡片 -->
        <div class="bg-white rounded-2xl p-4 shadow-[0_4px_20px_rgba(0,0,0,0.02)] border border-slate-100 flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <div class="flex flex-col gap-0.5">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">目前座標</label>
                    <div class="flex items-baseline gap-1.5">
                        <span id="current-lat" class="text-sm font-semibold font-mono text-slate-700">--.----</span>
                        <span class="text-slate-300">,</span>
                        <span id="current-lng" class="text-sm font-semibold font-mono text-slate-700">--.----</span>
                    </div>
                </div>
                <div class="text-[11px] font-medium text-slate-400 bg-slate-50 px-2 py-1 rounded-md" id="location-accuracy">
                    精準度: 未知
                </div>
            </div>

            <button id="save-btn" class="w-full bg-line text-white font-bold text-sm py-3.5 rounded-xl shadow-sm hover:shadow-[0_4px_12px_rgba(6,199,85,0.15)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 hover:bg-line-dark">
                <i class="fa-solid fa-location-crosshairs text-sm"></i>
                紀錄目前位置
            </button>
        </div>

        <!-- 列表區域 -->
        <div class="flex flex-col gap-4">
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center gap-2">
                    <h2 class="font-bold text-slate-800 text-sm tracking-tight">已儲存的地點</h2>
                    <span class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full border border-slate-200/40" id="saved-count">0</span>
                </div>
            </div>

            <!-- 分類過濾選單 (視覺感設計) -->
            <div class="flex gap-2 overflow-x-auto scrollbar-hide py-1 px-1 -mx-1" id="tag-filter-container">
                <button onclick="filterByTag('all')" class="tag-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white shadow-sm border border-transparent transition-all shrink-0" data-filter="all">
                    全部
                </button>
                <button onclick="filterByTag('parking')" class="tag-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200/50 hover:bg-slate-50 transition-all shrink-0" data-filter="parking">
                    <i class="fa-solid fa-square-parking text-blue-500 mr-1"></i> 停車
                </button>
                <button onclick="filterByTag('food')" class="tag-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200/50 hover:bg-slate-50 transition-all shrink-0" data-filter="food">
                    <i class="fa-solid fa-utensils text-orange-500 mr-1"></i> 美食
                </button>
                <button onclick="filterByTag('star')" class="tag-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200/50 hover:bg-slate-50 transition-all shrink-0" data-filter="star">
                    <i class="fa-solid fa-star text-yellow-500 mr-1"></i> 景點
                </button>
            </div>
            
            <div id="location-list" class="flex flex-col gap-3 pb-8 transition-all duration-300">
                <!-- 列表將由 JS 動態載入 -->
                <div class="text-center py-12 bg-white rounded-2xl border border-slate-100 shadow-[0_4px_20px_rgba(0,0,0,0.01)] text-slate-400">
                    <i class="fa-solid fa-map-location-dot text-3xl mb-3 opacity-20 text-slate-500"></i>
                    <p class="text-xs">還沒有儲存任何地點</p>
                </div>
            </div>
        </div>
    </main>

    <!-- JS Logic -->
    <script>
        // 設定區
        const LIFF_ID = "2009193332-1iBnYyMP";
        
        // 狀態變數
        let currentPos = { lat: 25.0330, lng: 121.5654 }; // 預設台北 101
        let map = null;
        let currentMarker = null;
        let isLineClient = false;
        let activeFilter = 'all';

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            initMap();
            loadSavedLocations();
            
            try {
                if (LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID_HERE") {
                    await liff.init({ liffId: LIFF_ID });
                    isLineClient = liff.isInClient();
                    
                    if (!isLineClient) {
                         handleFallbackMode();
                    } else {
                        updateStatus("LINE LIFF Mode", "bg-emerald-50 text-emerald-600 border border-emerald-100");
                    }
                } else {
                    console.warn("LIFF ID 未設定");
                    handleFallbackMode("設定尚未完成");
                }
            } catch (err) {
                console.error("LIFF Init Error:", err);
                handleFallbackMode("Error: " + err.code);
            }

            startGeolocation();
        });

        function handleFallbackMode(msg) {
            document.getElementById('line-fallback-banner').classList.remove('hidden');
            document.getElementById('open-line-btn').onclick = () => {
                if(LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID_HERE") {
                    location.href = `https://line.me/R/app/${LIFF_ID}`;
                } else {
                    Swal.fire({
                        title: "未設定 LIFF ID",
                        text: "請先在程式碼中填入您的 LINE LIFF ID",
                        icon: "warning",
                        customClass: { popup: 'custom-swal' }
                    });
                }
            };
            updateStatus("Browser Mode", "bg-amber-50 text-amber-600 border border-amber-100");
        }

        function updateStatus(text, classes) {
            const el = document.getElementById('status-indicator');
            el.innerText = text;
            el.className = `text-[10px] px-2.5 py-1 rounded-full font-semibold ${classes}`;
        }

        // --- Map & Geolocation ---
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([currentPos.lat, currentPos.lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            // 自訂現代圖釘樣式
            const pinIcon = L.divIcon({
                html: `<div class="relative flex items-center justify-center">
                    <span class="animate-ping absolute inline-flex h-6 w-6 rounded-full bg-emerald-500 opacity-20"></span>
                    <div class="relative w-4 h-4 bg-emerald-500 border-2 border-white rounded-full shadow-md"></div>
                </div>`,
                className: 'custom-leaflet-pin',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            currentMarker = L.marker([currentPos.lat, currentPos.lng], {
                draggable: true,
                icon: pinIcon
            }).addTo(map);

            currentMarker.on('dragend', function(e) {
                const pos = e.target.getLatLng();
                currentPos.lat = pos.lat;
                currentPos.lng = pos.lng;
                updateCoordDisplay(pos.lat, pos.lng, "手動調整");
            });
            
            document.getElementById('recenter-btn').addEventListener('click', () => {
                startGeolocation();
            });
        }

        function startGeolocation() {
            if (!navigator.geolocation) {
                Swal.fire({
                    title: '錯誤',
                    text: '您的裝置未開啟或不支援定位功能',
                    icon: 'error',
                    customClass: { popup: 'custom-swal' }
                });
                return;
            }

            const btn = document.getElementById('recenter-btn');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-line"></i>';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const { latitude, longitude, accuracy } = position.coords;
                    currentPos = { lat: latitude, lng: longitude };
                    
                    map.setView([latitude, longitude], 17);
                    currentMarker.setLatLng([latitude, longitude]);
                    
                    updateCoordDisplay(latitude, longitude, accuracy);
                    btn.innerHTML = '<i class="fa-solid fa-crosshairs"></i>';
                },
                (error) => {
                    console.error(error);
                    Swal.fire({
                        title: '無法取得位置',
                        text: '請確認已授權 LINE 或瀏覽器的位置讀取權限。',
                        icon: 'warning',
                        customClass: { popup: 'custom-swal' }
                    });
                    btn.innerHTML = '<i class="fa-solid fa-crosshairs"></i>';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function updateCoordDisplay(lat, lng, acc) {
            document.getElementById('current-lat').innerText = lat.toFixed(5);
            document.getElementById('current-lng').innerText = lng.toFixed(5);
            const accText = typeof acc === 'number' ? `誤差約 ${Math.round(acc)}m` : (acc || "手動微調");
            document.getElementById('location-accuracy').innerText = accText;
        }

        // --- Save Logic ---
        document.getElementById('save-btn').addEventListener('click', async () => {
            const { value: formValues } = await Swal.fire({
                title: '紀錄當前位置',
                customClass: { popup: 'custom-swal' },
                html: `
                    <div class="flex flex-col gap-4 text-left font-sans">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">地點名稱</label>
                            <input id="swal-input1" class="swal2-input !m-0 !w-full !text-sm !p-3" placeholder="例如：百貨公司 B3 停車位">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wide">選擇標籤</label>
                            <div class="flex gap-2.5 justify-center" id="tag-selector">
                                <label class="flex-1 cursor-pointer">
                                    <input type="radio" name="loc-tag" value="parking" class="peer sr-only" checked>
                                    <div class="py-2.5 rounded-xl bg-slate-50 text-slate-500 peer-checked:bg-blue-50 peer-checked:text-blue-600 peer-checked:border-blue-200 border border-transparent transition-all text-xs font-semibold text-center">
                                        <i class="fa-solid fa-square-parking text-base mb-1 block"></i> 停車
                                    </div>
                                </label>
                                <label class="flex-1 cursor-pointer">
                                    <input type="radio" name="loc-tag" value="food" class="peer sr-only">
                                    <div class="py-2.5 rounded-xl bg-slate-50 text-slate-500 peer-checked:bg-orange-50 peer-checked:text-orange-600 peer-checked:border-orange-200 border border-transparent transition-all text-xs font-semibold text-center">
                                        <i class="fa-solid fa-utensils text-base mb-1 block"></i> 美食
                                    </div>
                                </label>
                                <label class="flex-1 cursor-pointer">
                                    <input type="radio" name="loc-tag" value="star" class="peer sr-only">
                                    <div class="py-2.5 rounded-xl bg-slate-50 text-slate-500 peer-checked:bg-yellow-50/50 peer-checked:text-yellow-600 peer-checked:border-yellow-200 border border-transparent transition-all text-xs font-semibold text-center">
                                        <i class="fa-solid fa-star text-base mb-1 block"></i> 景點
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: '儲存',
                confirmButtonColor: '#06C755',
                cancelButtonText: '取消',
                preConfirm: () => {
                    const name = document.getElementById('swal-input1').value;
                    const tag = document.querySelector('input[name="loc-tag"]:checked').value;
                    if (!name) {
                        Swal.showValidationMessage('請輸入地點名稱');
                    }
                    return { name: name, tag: tag }
                }
            });

            if (formValues) {
                saveLocation(formValues.name, formValues.tag);
            }
        });

        function saveLocation(name, tag) {
            const newItem = {
                id: Date.now().toString(),
                name: name,
                lat: currentPos.lat,
                lng: currentPos.lng,
                tag: tag,
                timestamp: Date.now(),
                dateStr: new Date().toLocaleString('zh-TW', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute:'2-digit' })
            };

            const list = getSavedList();
            list.unshift(newItem);
            localStorage.setItem('saved_locations', JSON.stringify(list));
            
            loadSavedLocations();
            
            Swal.fire({
                icon: 'success',
                title: '儲存成功',
                showConfirmButton: false,
                timer: 1000,
                customClass: { popup: 'custom-swal' }
            });
        }

        function getSavedList() {
            const saved = localStorage.getItem('saved_locations');
            return saved ? JSON.parse(saved) : [];
        }

        function deleteLocation(id) {
            Swal.fire({
                title: '確定刪除此地點？',
                text: "刪除後將無法復原此位置紀錄。",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: '刪除',
                cancelButtonText: '取消',
                customClass: { popup: 'custom-swal' }
            }).then((result) => {
                if (result.isConfirmed) {
                    let list = getSavedList();
                    list = list.filter(item => item.id !== id);
                    localStorage.setItem('saved_locations', JSON.stringify(list));
                    loadSavedLocations();
                }
            });
        }

        // --- Filter Logic ---
        function filterByTag(tag) {
            activeFilter = tag;
            
            // 更新篩選按鈕視覺樣式
            document.querySelectorAll('.tag-filter-btn').forEach(btn => {
                const filterType = btn.getAttribute('data-filter');
                if (filterType === tag) {
                    btn.className = "tag-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white shadow-sm border border-transparent transition-all shrink-0";
                } else {
                    btn.className = "tag-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200/50 hover:bg-slate-50 transition-all shrink-0";
                }
            });

            loadSavedLocations();
        }

        // --- Render List ---
        function loadSavedLocations() {
            let list = getSavedList();
            const container = document.getElementById('location-list');
            document.getElementById('saved-count').innerText = list.length;
            
            // 執行篩選
            if (activeFilter !== 'all') {
                list = list.filter(item => item.tag === activeFilter);
            }

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-100 shadow-[0_4px_20px_rgba(0,0,0,0.01)] text-slate-400">
                        <i class="fa-solid fa-map-location-dot text-3xl mb-3 opacity-20 text-slate-500"></i>
                        <p class="text-xs">沒有此分類的地點紀錄</p>
                    </div>`;
                return;
            }

            container.innerHTML = '';
            list.forEach(item => {
                // Tag Styles (以質感極簡的邊框與軟性背景為主)
                let tagHtml = '';
                if(item.tag === 'parking') {
                    tagHtml = `<span class="inline-flex items-center gap-1 bg-blue-50 text-blue-600 text-[10px] px-2 py-0.5 rounded-md font-semibold border border-blue-100/50"><i class="fa-solid fa-square-parking text-xs"></i> 停車</span>`;
                } else if(item.tag === 'food') {
                    tagHtml = `<span class="inline-flex items-center gap-1 bg-orange-50 text-orange-600 text-[10px] px-2 py-0.5 rounded-md font-semibold border border-orange-100/50"><i class="fa-solid fa-utensils text-xs"></i> 美食</span>`;
                } else {
                    tagHtml = `<span class="inline-flex items-center gap-1 bg-yellow-50 text-yellow-600 text-[10px] px-2 py-0.5 rounded-md font-semibold border border-yellow-100/50"><i class="fa-solid fa-star text-xs"></i> 景點</span>`;
                }

                const el = document.createElement('div');
                el.className = 'bg-white p-4 rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.01)] border border-slate-100 hover:border-slate-200/80 transition-all duration-200 flex justify-between items-center group active:scale-[0.99]';
                el.innerHTML = `
                    <div class="flex-1 min-w-0 pr-3 cursor-pointer" onclick="viewOnMap(${item.lat}, ${item.lng})">
                        <div class="flex items-center gap-2 mb-1.5">
                            ${tagHtml}
                            <h3 class="font-bold text-slate-800 truncate text-sm tracking-tight">${item.name}</h3>
                        </div>
                        <p class="text-[10px] text-slate-400 flex items-center gap-1 font-medium">
                            <i class="fa-regular fa-clock text-xs"></i> ${item.dateStr}
                        </p>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <a href="https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}" target="_blank" class="bg-slate-50 hover:bg-slate-100/80 text-slate-600 p-2.5 rounded-xl border border-slate-100 transition active:scale-95 flex items-center justify-center" title="Google Maps 導航">
                            <i class="fa-solid fa-location-arrow text-base"></i>
                        </a>
                        <button onclick="deleteLocation('${item.id}'); event.stopPropagation();" class="bg-rose-50/50 hover:bg-rose-50 text-rose-500 hover:text-rose-600 p-2.5 rounded-xl border border-rose-100/40 transition active:scale-95 flex items-center justify-center" title="刪除">
                            <i class="fa-regular fa-trash-can text-base"></i>
                        </button>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function viewOnMap(lat, lng) {
            currentPos = { lat, lng };
            map.setView([lat, lng], 17);
            currentMarker.setLatLng([lat, lng]);
            updateCoordDisplay(lat, lng, "查看地點");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

    </script>
</body>
</html>
